name: Terraform

# DNS for hickorydocs.com. Plans are posted on pull requests so an
# infrastructure change is reviewable before it lands — that reviewable diff is
# the whole reason Terraform is here rather than the Cloudflare dashboard.
#
# There is no auto-apply. This zone serves production, and `plan-deploy-shared`
# is explicit that production changes go through a gated path, never a branch
# push. So `master` still only plans; applying is a deliberate act.

on:
  pull_request:
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  push:
    branches: [master]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the plan (otherwise plan only)"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  # One at a time: two applies against one zone is how a DNS record ends up
  # half-written.
  group: terraform-dns
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"

# Every secret lives in a GitHub Environment, never on the repository. That
# means each job must declare which environment it draws from — a
# workflow-level `env:` block cannot resolve environment secrets.
jobs:
  plan:
    runs-on: ubuntu-latest
    # Ungated on purpose. A plan that needs approval before it renders is a
    # plan nobody reads, and the reviewable diff is the entire reason this
    # stack exists rather than the Cloudflare dashboard.
    environment: production-plan
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TF_VAR_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    defaults:
      run:
        working-directory: terraform/dns
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Init
        run: |
          terraform init \
            -backend-config="endpoints={s3=\"https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com\"}"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Validate
        run: terraform validate

      - name: Plan
        id: plan
        # Exit code 2 means "changes present", which is information rather than
        # failure; only a real error should fail the job.
        run: |
          set +e
          terraform plan -detailed-exitcode -no-color -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          tail -c 60000 plan.txt
          [ "$code" = "1" ] && exit 1
          exit 0

      - name: Comment the plan on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/dns/plan.txt', 'utf8');
            // GitHub caps a comment at 65536 characters.
            const body = plan.length > 60000
              ? plan.slice(0, 60000) + '\n\n…truncated; see the job log for the full plan.'
              : plan;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '### Terraform plan — DNS\n\n```terraform\n' + body + '\n```',
            });

      - name: Save the plan for the apply job
        if: github.event_name == 'workflow_dispatch' && inputs.apply
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/dns/tfplan
          retention-days: 1

  apply:
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.apply
    runs-on: ubuntu-latest
    # The gate. `production` requires a reviewer, and this job cannot start
    # until that approval lands.
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TF_VAR_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    defaults:
      run:
        working-directory: terraform/dns
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Init
        run: |
          terraform init \
            -backend-config="endpoints={s3=\"https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com\"}"

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform/dns

      - name: Apply the reviewed plan
        # The saved plan file, not a fresh one: applying a re-planned diff would
        # apply something nobody looked at.
        run: terraform apply -no-color tfplan
