name: Simple frontends
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.filter.outputs.browser }}
      apple: ${{ steps.filter.outputs.apple }}
      android: ${{ steps.filter.outputs.android }}
      windows: ${{ steps.filter.outputs.windows }}
      linux: ${{ steps.filter.outputs.linux }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: filter
        shell: bash
        run: |
          checks=$(scripts/affected-checks.sh "origin/${{ github.base_ref }}")
          for platform in browser apple android windows linux; do
            if grep -qx "simple-$platform" <<<"$checks"; then
              echo "$platform=true" >> "$GITHUB_OUTPUT"
            else
              echo "$platform=false" >> "$GITHUB_OUTPUT"
            fi
          done
  browser:
    needs: [changes]
    if: always() && (github.event_name == 'push' || needs.changes.outputs.browser == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - uses: extractions/setup-just@v4
      - run: npm --prefix apps/web ci
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
      - run: just simple-test browser
      - run: cd apps/web && npx playwright install --with-deps chromium
      - run: just test-e2e
  apple:
    needs: [changes]
    if: always() && (github.event_name == 'push' || needs.changes.outputs.apple == 'true')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v4
      - run: brew install xcodegen
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm --prefix apps/web ci
      - run: just simple-test apple
      - run: just simple-build ios
  android:
    needs: [changes]
    if: always() && (github.event_name == 'push' || needs.changes.outputs.android == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.3.1' }
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: just simple-test android
  windows:
    needs: [changes]
    if: always() && (github.event_name == 'push' || needs.changes.outputs.windows == 'true')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - name: Build and open the WinForms workspace
        shell: bash
        run: just simple-test windows
  linux:
    needs: [changes]
    if: always() && (github.event_name == 'push' || needs.changes.outputs.linux == 'true')
    name: Simple KDE ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: debian:13
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Install the Debian KDE toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git curl xz-utils \
            build-essential cmake pkg-config qt6-base-dev qt6-webengine-dev \
            libkf6coreaddons-dev libkf6xmlgui-dev
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: extractions/setup-just@v4
      - run: just simple-build linux
