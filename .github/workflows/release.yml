name: Release

# Tag-triggered so a release is a deliberate act, never a side effect of a
# push to master. `v0.1.0` style tags only.
on:
  push:
    tags: ["v*"]
  # Lets you produce a draft from a branch without tagging, to check the
  # artifacts before committing to a version number.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not delete the artifacts of the others —
      # a partial release is still worth publishing as a draft.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p hickory-cli --target ${{ matrix.target }}

      - name: Smoke-test the artifact
        # Never ship a binary nobody has run. This executes a real document
        # end to end — the one example that needs nothing but a POSIX shell.
        run: |
          BIN=target/${{ matrix.target }}/release/hickory
          "$BIN" --version
          "$BIN" check examples/text-tools-tour.hick

      - name: Package
        id: package
        run: |
          NAME="hickory-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp target/${{ matrix.target }}/release/hickory "dist/$NAME/"
          cp LICENSE README.md "dist/$NAME/"
          tar -czf "dist/$NAME.tar.gz" -C dist "$NAME"
          # Checksums are generated next to the archive on the machine that
          # built it, so a mismatch downstream means tampering and not a
          # packaging slip.
          shasum -a 256 "dist/$NAME.tar.gz" > "dist/$NAME.tar.gz.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Only a tag produces a release; workflow_dispatch stops at artifacts.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish a draft release
        # Draft, not published: a human reads the notes and presses the
        # button. Releasing is outward-facing and irreversible in practice.
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          generate_release_notes: true
