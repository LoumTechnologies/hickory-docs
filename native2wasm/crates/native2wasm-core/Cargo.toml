[package]
name = "native2wasm-core"
version = "0.1.0"
edition = "2024"
description = "Shared AOT transpilation pipeline for native x86_64 → WASI WebAssembly"

[lib]
name = "native2wasm_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
log = "0.4"
tempfile = "3"
thiserror = "2"
which = "7"

[build-dependencies]
cc = "1"
cmake = "0.1"
