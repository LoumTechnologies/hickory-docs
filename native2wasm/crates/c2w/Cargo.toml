[package]
name = "c2w"
version = "0.1.0"
edition = "2024"
description = "Container to WASM converter"

[lib]
name = "c2w"
path = "src/lib.rs"

[features]
default = []
# Use the wizer crate for library-based pre-initialization instead of
# shelling out to the wizer CLI binary. Pulls in wasmtime as a transitive
# dependency, which significantly increases compile time and binary size.
wizer-lib = ["dep:wizer"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
filetime = "0.2"
log = "0.4"
oci-pull = { path = "../oci-pull" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
walkdir = "2"
which = "7"
wizer = { version = "4", optional = true }
