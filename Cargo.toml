[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["crates/container2wasm", "crates/drift-signal-ffi", "matrix"]

[workspace.dependencies]
hick-lang = { path = "../hick-lang" }
hick-flow = { path = "../hick-reactive/crates/hick-flow" }
hick-exec = { path = "../hick-exec/crates/hick-exec" }
hick-condition = { path = "../hick-exec/crates/hick-condition" }
wasmtime = { version = "41.0.0", default-features = false, features = [
    "async", "cache", "cranelift", "runtime", "std", "threads", "wat",
    "profiling", "parallel-compilation", "pooling-allocator",
    "demangle", "addr2line", "coredump", "debug-builtins",
    "gc", "gc-drc", "gc-null",
    "component-model", "component-model-async",
] }
