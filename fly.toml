# Fly.io deployment for the Hickory Docs server + web app.
#
# See docs/operators/deploy-fly.md — in particular the execution section: the
# app deploys and runs here, but `HICKORY_EXECUTOR=docker` needs a Docker
# daemon reachable over DOCKER_HOST, which a Fly Machine does not provide by
# itself.

app = "hickory-docs-production"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  PORT = "8080"
  GIT_DATA_DIR = "/data/git"
  # A Fly Machine provides no Docker daemon, so the docker executor cannot
  # run here (see docs/operators/deploy-fly.md). `local` means image= is
  # IGNORED and cells run against this image's toolchain — a real limitation,
  # stated rather than silently degraded to.
  HICKORY_EXECUTOR = "local"
  # The network a container gets when its document asks for none — which is
  # every document that does not carry `<hick:allow network="host:port">`.
  # A document that needs the network is the exception; the default should
  # not be "exfiltration is possible". What "yes" resolves to is
  # HICKORY_DOCKER_ALLOWED_NETWORK (default `bridge`); both are inert while
  # HICKORY_EXECUTOR is `local`.
  HICKORY_DOCKER_NETWORK = "none"

# Durable document history. Postgres holds live state and the CRDT holds the
# in-flight editing session, but the per-project git repositories live HERE —
# deploy without this mount and every restart silently loses history.
[[mounts]]
  source = "hickory_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero: the machine stops when idle and wakes on the next request,
  # so an instance nobody is using costs nothing. A live collaboration session
  # holds a WebSocket, which keeps it awake for exactly as long as someone is
  # actually working — which is when you want to be paying.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    # WebSocket rooms are long-lived, so connection count is the meaningful
    # limit rather than request rate.
    hard_limit = 200
    soft_limit = 150

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Boot-time config the server refuses to start without in production
# (DATABASE_URL, JWT_SECRET) is set with `fly secrets set`, never here — this
# file is committed.
