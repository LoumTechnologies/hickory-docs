# Dev dependencies only (the server itself runs via `just dev`).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hickory
      POSTGRES_PASSWORD: hickory
      POSTGRES_DB: hickory
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hickory -d hickory"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  pgdata:
