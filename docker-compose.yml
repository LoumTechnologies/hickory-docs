# Dev dependencies only (the server itself runs via `just dev`).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hickory
      POSTGRES_PASSWORD: hickory
      POSTGRES_DB: hickory
      # Port Zero publishes this container at a stable name. Unlike the server
      # and web dev server (which bind port 0), Postgres KEEPS a fixed host
      # port below: CI has no Postgres service, and integration.rs bootstraps
      # one with `docker compose up -d --wait db`, reaching it at the
      # hardcoded localhost:5433 fallback. Dev uses the name, tests use the
      # port, and the daemon is a no-op when it isn't running.
      PZ_TUNNEL: "db.${PZ_NAMESPACE:-hickory}.portzero.local:5432"
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hickory -d hickory"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  pgdata:
