[package]
name = "hick-eval-store"
version = "0.1.0"
edition = "2024"
description = "Append-only eval results store: per-machine NDJSON files with git sync and home-folder fallback."
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
