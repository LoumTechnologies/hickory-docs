[package]
name = "hick-agent-hick-edit"
version = "0.1.0"
edition = "2024"
description = "Hick-XML-aware agent extension: edit format, pipeline watcher, reverse provenance, and composition helpers"
publish = false

[dependencies]
hick-agent-sdk = { path = "../hick-agent-sdk" }
hick-literate = { version = "0.1", path = "../../../crates/hick-literate" }
hick-lens = { version = "0.1", path = "../../../hick-lang/crates/hick-lens" }
hick-flow = { workspace = true, features = ["serde"] }
hick-exec.workspace = true
hick-lang.workspace = true

async-trait = "0.1"
anyhow = "1"
log = "0.4"
notify = "7"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
glob = "0.3"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
