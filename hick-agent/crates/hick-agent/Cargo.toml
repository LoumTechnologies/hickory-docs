[package]
name = "hick-agent"
version = "0.1.0"
edition = "2024"
description = "AI command-line coding agent — script-first model with transparent Hick pipeline"
publish = false

[[bin]]
name = "hick-agent"
path = "src/main.rs"

[features]
default = []
local = ["hick-agent-engine/local"]
local-cuda = ["local", "hick-agent-engine/local-cuda"]
integration-test = ["hick-agent-engine/integration-test"]

[dependencies]
# Core engine (extracted)
hick-agent-engine = { path = "../hick-agent-engine" }

# Dependencies only needed by the CLI binary (main.rs) and TUI (tui.rs)
hick = { version = "0.1", path = "../../../hickory-docs/crates/hick" }
hick-agent-core = { path = "../hick-agent-core" }
hick-token.workspace = true
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15.7"
env_logger = "0.11"
log = "0.4"
rand = "0.9"
tokio = { version = "1", features = ["full"] }
ratatui = "0.30.0"
crossterm = "0.29.0"

[dev-dependencies]
tempfile = "3"
zip = "2"
