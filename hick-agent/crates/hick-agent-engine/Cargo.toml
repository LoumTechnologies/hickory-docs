[package]
name = "hick-agent-engine"
version = "0.1.0"
edition = "2024"
description = "Re-export shim — all agent logic lives in hick-agent-script-first and hick-agent-sdk. Only llm_local (llama.cpp) stays here."
publish = false

[features]
default = []
local = ["dep:llama-cpp-2"]
local-cuda = ["local", "llama-cpp-2/cuda"]
integration-test = []

[dependencies]
hick-agent-script-first = { path = "../hick-agent-script-first" }
hick-agent-sdk = { path = "../hick-agent-sdk" }
hick-agent-core = { path = "../hick-agent-core" }
hick-token.workspace = true
hick-policy.workspace = true

# Only needed for the llama.cpp local provider (kept in this crate only)
async-trait = "0.1"
anyhow = "1"
futures = "0.3"
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1", optional = true, features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2 = { version = "0.1", optional = true }

[dev-dependencies]
tempfile = "3"
