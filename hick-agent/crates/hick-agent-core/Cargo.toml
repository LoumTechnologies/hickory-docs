[package]
name = "hick-agent-core"
version = "0.1.0"
edition = "2024"
description = "Re-export shim — command execution types (local) and hick-XML edit types from hick-agent-hick-edit"
publish = false

[dependencies]
hick-agent-hick-edit = { path = "../hick-agent-hick-edit" }
hick-literate = { version = "0.1", path = "../../../crates/hick-literate" }
hick-token.workspace = true
async-trait = "0.1"
anyhow = "1"
tokio = { version = "1", features = ["sync", "fs"] }
