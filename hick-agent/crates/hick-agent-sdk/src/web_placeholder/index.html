<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Hick Agent — Web placeholder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <script src="/assets/app.js" defer></script>
  <style>
    :root {
      font-family: system-ui, sans-serif;
      background: #0f1419;
      color: #dce4ec;
    }
    body { margin: 0; padding: 1rem; max-width: 960px; }
    #log {
      white-space: pre-wrap;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      background: #1a2230;
      border: 1px solid #2a3545;
      border-radius: 6px;
      padding: 12px;
      min-height: 240px;
      max-height: 60vh;
      overflow: auto;
    }
    #row { display: flex; gap: 8px; margin-top: 12px; }
    input[type="text"] {
      flex: 1;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #2a3545;
      background: #1a2230;
      color: inherit;
    }
    button {
      padding: 8px 14px;
      border-radius: 4px;
      border: none;
      background: #3b82f6;
      color: white;
      cursor: pointer;
    }
    button.secondary { background: #475569; }
    h1 { font-size: 1.15rem; font-weight: 600; }
    .muted { color: #8b98a9; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>Hick Agent — UI wire test</h1>
  <p class="muted">Streams <code>UiEvent</code> JSON from <code>/ws</code>. Real React shell comes in TASK-37.4.</p>
  <div id="log"></div>
  <div id="row">
    <input id="prompt" type="text" placeholder='Send {"type":"message","text":"…"} equivalent — plain text wraps as Message' autocomplete="off"/>
    <button type="button" id="send">Send</button>
    <button type="button" id="cancel" class="secondary">Cancel</button>
  </div>
</body>
</html>
