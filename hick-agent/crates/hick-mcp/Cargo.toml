[package]
name = "hick-mcp"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "hick-mcp"
path = "src/main.rs"

[dependencies]
hick = { version = "0.1", path = "../../../hickory-docs/crates/hick" }
hick-lens = { version = "0.1", path = "../../../hickory-docs/crates/hick-lens" }
hick-flow.workspace = true
hick-lang.workspace = true
hick-exec.workspace = true
rmcp = { version = "0.15", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
log = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
