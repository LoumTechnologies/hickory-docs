[package]
name = "iron-peak"
version = "0.1.0"
edition = "2024"
description = "Hick-native AI coding agent — script-first ReAct loop with transparent hick pipeline integration"
publish = false

[[bin]]
name = "iron-peak"
path = "src/main.rs"

[features]
default = []
local = ["dep:hick-agent-engine", "hick-agent-engine/local"]
local-cuda = ["local", "hick-agent-engine/local-cuda"]
integration-test = []

[dependencies]
# SDK + extension crates — wired directly in main.rs / tui.rs
hick-agent-sdk = { path = "../hick-agent-sdk", features = ["web", "relay"] }
hick-agent-script-first = { path = "../hick-agent-script-first" }
hick-agent-hick-edit = { path = "../hick-agent-hick-edit" }
hick-agent-tui = { path = "../hick-agent-tui" }
hick-policy.workspace = true

# Engine shim kept only for the optional llama.cpp local provider
hick-agent-engine = { path = "../hick-agent-engine", optional = true }

# Dependencies only needed by the CLI binary (main.rs).
hick = { version = "0.1", path = "../../../crates/hick" }
hick-lang.workspace = true
hick-agent-core = { path = "../hick-agent-core" }
hick-secrets.workspace = true
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
hick-token.workspace = true
dotenvy = "0.15.7"
log = "0.4"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"

[dev-dependencies]
async-trait = "0.1"
futures = "0.3"
hick = { version = "0.1", path = "../../../crates/hick" }
tempfile = "3"
zip = "2"
