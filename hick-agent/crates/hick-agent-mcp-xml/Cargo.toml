[package]
name = "hick-agent-mcp-xml"
version = "0.1.0"
edition = "2024"
description = "MCP extension: <hick:tool> XML element dispatcher — LLM writes declarative XML, extension dispatches to MCP and injects results."
publish = false

[dependencies]
hick-agent-sdk = { path = "../hick-agent-sdk" }
hick-classify.workspace = true

anyhow = "1"
async-trait = "0.1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
