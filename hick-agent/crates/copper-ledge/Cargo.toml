[package]
name = "copper-ledge"
version = "0.1.0"
edition = "2024"
description = "Standard AI coding agent — script-first ReAct loop, WASM sandbox, no pipeline-specific knowledge."
publish = false

[[bin]]
name = "copper-ledge"
path = "src/main.rs"

[features]
default = []

[dependencies]
# SDK + script-first extension — no hick pipeline dependencies in this manifest
hick-agent-sdk = { path = "../hick-agent-sdk", features = ["web", "relay"] }
hick-agent-script-first = { path = "../hick-agent-script-first" }
hick-agent-core = { path = "../hick-agent-core" }
hick-agent-tui = { path = "../hick-agent-tui" }
hick-policy.workspace = true

# CLI binary dependencies
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
hick-token.workspace = true
dotenvy = "0.15.7"
log = "0.4"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
