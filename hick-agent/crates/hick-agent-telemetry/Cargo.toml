[package]
name = "hick-agent-telemetry"
version = "0.1.0"
edition = "2024"
description = "Phone-home token usage telemetry extension — wraps any LlmClient and batches usage reports to hick-billing."
publish = false

[dependencies]
hick-agent-sdk = { path = "../hick-agent-sdk" }

anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
log = "0.4"
dirs-next = "2"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
