[package]
name = "oci-pull"
version = "0.1.0"
edition = "2021"
description = "Pure Rust OCI registry client for pulling and extracting container images"

[dependencies]
anyhow = "1"
base64 = "0.22"
dirs = "6"
flate2 = "1"
log = "0.4"
oci-client = "0.14"
oci-spec = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
