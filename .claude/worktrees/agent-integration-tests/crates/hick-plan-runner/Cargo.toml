[package]
name = "hick-plan-runner"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "hick-plan-runner"
path = "src/main.rs"

[dependencies]
hick-flow = { path = "../hick-flow" }
hick-exec = { path = "../hick-exec" }
hick-handlers = { path = "../hick-handlers" }
hick-live = { path = "../hick-live" }
hick-lang = { path = "../hick-lang" }
hick-token = { path = "../hick-token" }
hick-sink = { path = "../hick-sink" }
hick-policy = { path = "../hick-policy" }
hick-classify = { path = "../hick-classify" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
futures = "0.3"
