[package]
name = "container-testbed"
version = "0.1.0"
edition = "2024"

[dependencies]
container = { path = "../container" }
net-config = { path = "../net-config" }
connection-filter = { path = "../connection-filter" }
bridge = { path = "../bridge" }
wasmtime.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "time"] }
async-trait = "0.1"
anyhow = "1"
libc = "0.2"
log = "0.4.29"
env_logger = "0.11.8"
