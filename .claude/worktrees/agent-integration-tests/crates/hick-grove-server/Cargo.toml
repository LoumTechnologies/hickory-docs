[package]
name = "hick-grove-server"
version = "0.1.0"
edition = "2024"

[dependencies]
hick-grove = { path = "../hick-grove", features = ["sqlite-example"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tower = "0.5"
