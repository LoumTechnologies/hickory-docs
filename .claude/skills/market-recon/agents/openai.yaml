interface:
  display_name: "Market Recon"
  short_description: "Outward reconnaissance: alternatives, niches, investors, paygates, graveyard"
  default_prompt: "Use $market-recon to read the standing market the brain's own probes can't see, from a recon brief with a stated learning goal: the alternatives each in-scope persona already uses, niches/whitespace (interest × constraint × WTP with weak or mispriced supply), investor activity in adjacent markets, competitor paygate teardowns (gated = proven WTP, gate = value metric, ungated = gaps), and failed predecessors with their post-mortems classified niche/execution/timing. Write findings into the brain's stores (niche map, failure ledger, persona alternatives sets) with source, date, and confidence. Report a priori feasibility first (which facts are private/paywalled/stale), then observed findings, second-hand confusion signals, and declare the unknowables research hides (survivorship, self-report bias, private economics, 'no post-mortem found', staleness). Never fabricate; cite everything; respect access boundaries."
