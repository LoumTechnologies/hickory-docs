[package]
name = "hick-classify"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[features]
host-mask = ["arrow", "parquet", "blake3"]

[dependencies.arrow]
version = "54"
optional = true

[dependencies.parquet]
version = "54"
features = ["arrow"]
optional = true

[dependencies.blake3]
version = "1"
optional = true

[dev-dependencies]
tempfile = "3"
