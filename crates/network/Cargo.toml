[package]
name = "network"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
anyhow = "1"
smoltcp = { version = "0.12.0", default-features = false, features = ["std", "alloc", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp", "socket-raw"] }
async-trait = "0.1"
log = "0.4.29"
httparse = "1"
net_config_crate = { package = "net-config", path = "../net-config" }
connection_filter_crate = { package = "connection-filter", path = "../connection-filter" }
bridge_crate = { package = "bridge", path = "../bridge" }
tcp_nat_crate = { package = "tcp-nat", path = "../tcp-nat" }
