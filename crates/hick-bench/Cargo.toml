[package]
name = "hick-bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
hick-container.workspace = true
c2w = { path = "../../native2wasm/crates/c2w" }
wasmtime.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
tempfile = "3"
which = "7"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "conversion"
harness = false

[[bench]]
name = "container_boot"
harness = false
