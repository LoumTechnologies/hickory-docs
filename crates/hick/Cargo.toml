[package]
name = "hick"
version = "0.1.0"
edition = "2024"

[dependencies]
wasmtime = "41.0.0"
wasmtime-wasi = "41.0.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync"] }
anyhow = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "time"] }
