[package]
name = "hick"
version = "0.1.0"
edition = "2024"

[lib]
name = "hick"
path = "src/lib.rs"

[[bin]]
name = "hick"
path = "src/main.rs"

[[bin]]
name = "hick-equiv"
path = "src/bin/hick-equiv.rs"

[[bin]]
name = "hick-compact"
path = "src/bin/hick-compact.rs"

[dependencies]
container = { path = "../container" }
c2w = { path = "../c2w" }
connection-filter = { path = "../connection-filter", features = ["capability"] }
bridge = { path = "../bridge" }
net-config = { path = "../net-config" }
hick-api = { path = "../hick-api" }
hick-case = { path = "../hick-case" }
hick-condition = { path = "../hick-condition" }
hick-exec = { path = "../hick-exec" }
hick-handlers = { path = "../hick-handlers" }
hick-live = { path = "../hick-live" }
hick-feature = { path = "../hick-feature" }
hick-lang = { path = "../hick-lang" }
hick-secrets = { path = "../hick-secrets" }
hick-token = { path = "../hick-token" }

wasmtime.workspace = true
wasmtime-wasi = "41.0.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "time", "signal"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
rand = "0.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
thiserror = "2"
glob = "0.3.3"
sha2 = "0.10.9"
base64 = "0.22"
tar = "0.4"
hick-store = { version = "0.1.0", path = "../hick-store" }
hick-merge = { version = "0.1.0", path = "../hick-merge" }
notify = "7"
rustyline = "14"
futures = "0.3"
sysinfo = "0.38.0"

[dev-dependencies]
hick-store = { path = "../hick-store" }
tempfile = "3"
