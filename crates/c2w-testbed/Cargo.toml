[package]
name = "c2w-testbed"
version = "0.1.0"
edition = "2021"
description = "CLI testbed for the container2wasm library"

[[bin]]
name = "c2w"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
container2wasm = { path = "../container2wasm" }
env_logger = "0.11"
