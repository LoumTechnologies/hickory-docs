[package]
name = "elf2wasm"
version = "0.1.0"
edition = "2024"
description = "AOT transpiler: Linux ELF x86_64 -> WASI WebAssembly"

[lib]
name = "elf2wasm"
path = "src/lib.rs"

[[bin]]
name = "elf2wasm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
goblin = "0.9"
log = "0.4"
env_logger = "0.11"
tempfile = "3"
thiserror = "2"
which = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"
cmake = "0.1"
