[package]
name = "hickory-cli"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "hickory"
path = "src/main.rs"

[lib]
name = "hickory_cli"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
hick-exec.workspace = true
hick-lang.workspace = true
hick-literate = { path = "../hick-literate" }
hickory-agent = { path = "../hickory-agent" }
hickory-executor = { path = "../hickory-executor" }
hickory-executor-canopy = { path = "../hickory-executor-canopy" }
hickory-executor-docker = { path = "../hickory-executor-docker" }
hickory-lineage = { path = "../hickory-lineage" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3"
# SPIKE ONLY (issue #4, tests/spike_agent_placement.rs). Remove with the spike.
futures = "0.3"
