[package]
name = "c2w"
version = "0.1.0"
edition = "2021"
description = "Container to WASM converter"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
filetime = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tempfile = "3"
walkdir = "2"
which = "7"
