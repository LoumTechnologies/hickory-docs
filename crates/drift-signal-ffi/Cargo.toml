[package]
name = "drift-signal-ffi"
version = "0.1.0"
edition = "2024"
description = "UniFFI bindings for Drift Signal — exposes drift-signal-core to Swift/Kotlin"

[workspace]

[lib]
crate-type = ["staticlib", "cdylib"]
name = "drift_signal_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
drift-signal-core = { path = "../drift-signal-core" }
waymark-core = { path = "../../../waymark/crates/waymark-core" }
uniffi = { version = "0.29", features = ["cli"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
