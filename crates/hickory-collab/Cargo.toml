[package]
name = "hickory-collab"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
log = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }
yrs = { version = "0.21", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
