[package]
name = "hick-agent-core"
version = "0.1.0"
edition = "2024"
description = "Reusable abstractions for AI coding agents: sandboxed command execution and Hick XML edit format"

[dependencies]
hick = { path = "../hick" }
hick-lens = { path = "../hick-lens" }
hick-flow = { path = "../hick-flow", features = ["serde"] }
hick-exec = { path = "../hick-exec" }
async-trait = "0.1"
anyhow = "1"
tokio = { version = "1", features = ["sync", "fs"] }
