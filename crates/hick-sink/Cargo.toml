[package]
name = "hick-sink"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[dependencies]
hick-classify = { path = "../hick-classify" }
hick-token = { path = "../hick-token" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync"] }
log = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
