[package]
name = "hick-context-store"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
hick-context-protocol = { path = "../hick-context-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tempfile = "3"
fs2 = "0.4"
uuid = { version = "1", features = ["v4"] }
