[package]
name = "hick-mcp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "hick-mcp"
path = "src/main.rs"

[dependencies]
hick = { path = "../hick" }
hick-lens = { path = "../hick-lens" }
hick-flow = { path = "../hick-flow" }
hick-lang = { path = "../hick-lang" }
hick-exec = { path = "../hick-exec" }
rmcp = { version = "0.15", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
