[package]
name = "bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
container = { path = "../container" }
c2w = { path = "../c2w" }
wasmtime = "41.0.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
tempfile = "3"
which = "7"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "conversion"
harness = false

[[bench]]
name = "container_boot"
harness = false
