[package]
name = "hickory-identity"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std", "password-hash"] }
# `rand` is what exposes password_hash::rand_core, which SaltString::generate
# needs; the server got it transitively from another workspace member.
password-hash = { version = "0.5", features = ["rand_core"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
