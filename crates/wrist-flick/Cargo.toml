[package]
name = "wrist-flick"
version = "0.1.0"
edition = "2024"

[dependencies]
drift-signal-core = { path = "../drift-signal-core" }
hick-agent-engine = { path = "../hick-agent-engine" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-openai = "0.28"
async-trait = "0.1"
anyhow = "1"
uuid = { version = "1", features = ["v7"] }
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
async-stream = "0.3.6"
bytes = "1.11.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
