[package]
name = "hick-agent"
version = "0.1.0"
edition = "2024"
description = "AI command-line coding agent using Hick XML edit format and WASM sandbox execution"

[[bin]]
name = "hick-agent"
path = "src/main.rs"

[dependencies]
hick-agent-core = { path = "../hick-agent-core" }
async-openai = "0.28"
async-trait = "0.1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
log = "0.4"
