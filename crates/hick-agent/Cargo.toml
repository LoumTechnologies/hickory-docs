[package]
name = "hick-agent"
version = "0.1.0"
edition = "2024"
description = "AI command-line coding agent using Hick XML edit format and WASM sandbox execution"

[[bin]]
name = "hick-agent"
path = "src/main.rs"

[dependencies]
hick-agent-core = { path = "../hick-agent-core" }
hick-lens = { path = "../hick-lens" }
async-openai = "0.28"
async-trait = "0.1"
anyhow = "1"
bytes = "1"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
glob = "0.3"
hick-flow = { path = "../hick-flow", features = ["serde"] }
log = "0.4"
notify = "7"
serde_yaml = "0.9"
sha2 = "0.10"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
