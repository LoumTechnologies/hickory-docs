[package]
name = "hick-merge"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true

[dependencies]
hick-store = { path = "../hick-store" }
async-trait = "0.1"
thiserror = "2"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["sync"] }
log = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
