[package]
name = "hick-live"
version = "0.1.0"
edition = "2024"

[dependencies]
hick-flow.workspace = true
hick-exec.workspace = true
hick-handlers = { path = "../hick-handlers" }
hick-lang.workspace = true
arrow = { version = "54", features = ["prettyprint"] }
parquet = { version = "54", features = ["arrow"] }
tokio = { version = "1", features = ["sync", "rt", "macros"] }
futures = "0.3"
async-stream = "0.3"
anyhow = "1"
log = "0.4"
hick-classify = { path = "../hick-classify" }
hick-sink = { path = "../hick-sink" }
hick-token = { path = "../hick-token" }
blake3 = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
serde_json = "1"
