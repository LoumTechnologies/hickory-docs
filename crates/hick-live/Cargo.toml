[package]
name = "hick-live"
version = "0.1.0"
edition = "2024"

[dependencies]
hick-flow = { path = "../hick-flow" }
hick-exec = { path = "../hick-exec" }
hick-handlers = { path = "../hick-handlers" }
hick-lang = { path = "../hick-lang" }
arrow = { version = "54", features = ["prettyprint"] }
parquet = { version = "54", features = ["arrow"] }
tokio = { version = "1", features = ["sync", "rt", "macros"] }
futures = "0.3"
async-stream = "0.3"
anyhow = "1"
log = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
