[package]
name = "container"
version = "0.1.0"
edition = "2024"

[dependencies]
wasmtime.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time"] }
anyhow = "1"
wasi-common = { version = "41.0.1", features = ["tokio"] }
network.workspace = true
net-config.workspace = true
connection-filter.workspace = true
bridge.workspace = true
cap-std = "3.4.5"
async-trait = "0.1.89"
rustix = { version = "1.1.3", features = ["event"] }
log = "0.4"

[dev-dependencies]
zip = "2"
env_logger = "0.11"
os_pipe = "1.2.3"
