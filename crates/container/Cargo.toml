[package]
name = "container"
version = "0.1.0"
edition = "2024"

[dependencies]
wasmtime = "41.0.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time"] }
anyhow = "1"
wasi-common = { version = "41.0.1", features = ["tokio"] }
network = { version = "0.1.0", path = "../network" }
cap-std = "3.4.5"
async-trait = "0.1.89"
rustix = { version = "1.1.3", features = ["event"] }

[dev-dependencies]
zip = "2"
env_logger = "0.11"
log = "0.4"
os_pipe = "1.2.3"
