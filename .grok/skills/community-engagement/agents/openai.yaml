interface:
  display_name: "Community Engagement"
  short_description: "Organic community posting: plan where/when, create accounts ahead, rehearse comments, draft replies — no spam/astroturf"
  default_prompt: "Use $community-engagement as the organic sibling of $ads to get the word out where a cohort actually lives: read the persona's watering holes and $market-recon context, check the posting log for cadence, and plan a post that honors the community's self-promotion norms. Settle the account before the copy — check the account roster for which single identity posts in this community, whether it clears the age/karma gate, and report warm-up lead time as a blocker if it is cold; if the human has no account in a target community yet, flag it needs-creation and surface 'create this account now' as the long-pole to-do, because registering right before posting looks spammy and trips automod. Artifacts (post plans, posting log, account roster) live as Markdown under docs/market-learning/. Write the post and every reply via $audience-first-docs with the audience bound to that specific community (e.g. HN readers who distrust marketing), and UTM links via $implement-growth-experiments. Before posting, rehearse the anticipated comments — positive-curiosity, skeptical, correction-of-fact, hostile — and draft an honest answer to each; produce a probable-comments quick summary (the 3–7 most-likely comments for that platform, one-line answers, doc/video links) on top of the full objection sheet; if a criticism is true, route it back as a fix-reality finding, never a deflection. Plan when to post too: hand the human a range of good day/time windows (Tue/Wed/Thu defaults), always in Central Time, staggered against anything already scheduled. After the human posts (as themselves), run a live-assist subagent that matches real comments to the objection sheet, drafts replies for approval, logs outcomes, and feeds live confusion back to the personas and brain. Return the upward contract (feasibility like self-promo bans and cadence ceilings; observed engagement; live confusion; unknowables like lurker majority, shadowbans, comment selection bias). Write every post plan as a delegate-ready handoff: assume a technically literate person who didn't build the product may execute it, so it must answer every product-specific question up front (with an explicit escalation path for anything unanticipated) while skipping generic platform 101 they'd already know, never embed credentials (point to where they live instead), and stay printable as plain Markdown. Human-in-the-loop always; no sockpuppets, no seeded comments, no vote manipulation, exactly one identity per community; disclose affiliation and respect community rules and cadence."
