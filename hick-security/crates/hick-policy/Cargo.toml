[package]
name = "hick-policy"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
hick-classify = { path = "../hick-classify" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "time", "io-util"] }
log = "0.4"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
toml = "1"
