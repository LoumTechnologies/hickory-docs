interface:
  display_name: "Maximize Market Learning"
  short_description: "Strategy brain for money + market learning; conducts the hands"
  default_prompt: "Use $maximize-market-learning as the strategy brain for this product's go-to-market: read the lifecycle stage, look outward via $market-recon (alternatives our personas have, niches/whitespace, investor moves in adjacent markets, competitor paygates, and failed predecessors + their post-mortems — pure gold for pre-learning a niche's cause of death), then frame the cheapest probe that can surprise you and emit concrete artifacts (experiment plan, cohort definition, spend allocation, page/run spec, recon brief, niche map, failure ledger) for the technology hands to execute. Hunt niches and exploit each until it dries, then rotate. Maintain the on-disk persona library (discover/refine/split/merge/retire) and the niche map, commission discovery before confirmation, insist the hands return feasibility and declared unknowables, propose verdict thresholds per run, and hand real converting segments to $optimize-saas-pricing. Honor the human gates: never post/send/spend on the user's behalf — every external action stops as a draft for them to review, tweak, and execute; treat persona definition as a high-involvement collaborative gate; run the mechanical middle (recon, build, draft, analysis) hands-off without pestering."
