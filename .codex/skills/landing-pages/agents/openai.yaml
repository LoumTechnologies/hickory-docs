interface:
  display_name: "Landing Pages"
  short_description: "Build/instrument landing pages (construction hand)"
  default_prompt: "Use $landing-pages to build and instrument landing pages in the target repo's existing stack from a page spec: a single interest-organized discovery page (segments revealed as clusters, never audience-labeled sections) or distinct confirmation pages per discovered segment with confirm-or-correct probes. Wire events through $implement-growth-experiments and consume a visual system from $branding. Do not probe pages with personas — that is $persona-walkthrough; instead report the built page (entry URL, events, success signal) as ready to walk, and return the upward contract (feasibility, observations, declared unknowables) to the brain."
