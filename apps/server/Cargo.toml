[package]
name = "hickory-server"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
# Adding the print-openapi bin made `cargo run -p hickory-server` (no --bin)
# ambiguous; this keeps every existing bare callsite (scripts/dev.sh, `just
# agent`, a plain `cargo run -p hickory-server`) pointed at the server.
default-run = "hickory-server"

[[bin]]
name = "hickory-server"
path = "src/main.rs"

[[bin]]
name = "print-openapi"
path = "src/bin/print_openapi.rs"

[lib]
name = "hickory_server"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.11"
futures = "0.3"
hex = "0.4"
hick-lang.workspace = true
hick-literate = { path = "../../crates/hick-literate" }
hick-lsp = { path = "../../crates/hick-lsp" }
hickory-cli = { path = "../../crates/hickory-cli" }
hickory-agent = { path = "../../crates/hickory-agent" }
hickory-executor = { path = "../../crates/hickory-executor" }
hickory-executor-canopy = { path = "../../crates/hickory-executor-canopy" }
hickory-executor-docker = { path = "../../crates/hickory-executor-docker" }
hickory-lineage = { path = "../../crates/hickory-lineage" }
hmac = "0.12"
jsonwebtoken = "9"
log = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "json", "macros", "derive"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
uuid = { version = "1", features = ["v4", "serde"] }
yrs = { version = "0.21", features = ["sync"] }
utoipa = { version = "5.5.0", features = ["uuid", "chrono"] }

[dev-dependencies]
tokio-tungstenite = "0.24"
