[project]
name = "hickory-agent-worker"
version = "0.1.0"
description = "Confined LangGraph orchestration for the Hickory agent CLI"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2", "pydantic-monty==1.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hickory_agent_worker"]
